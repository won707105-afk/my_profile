<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 프로필</title>
    <style>
        /* 페이지 전체 스타일 */
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f5f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* 프로필 카드 스타일 */
        .profile-card {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }

        /* 프로필 이미지 스타일 */
        .profile-card img {
            width: 150px;
            height: 150px;
            border-radius: 50%; /* 이미지를 동그랗게 만듭니다 */
            object-fit: cover;
            margin-bottom: 20px;
            border: 4px solid #eaeaea;
        }

        /* 이름 및 소개글 스타일 */
        .profile-card h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: #2f3640;
        }

        .profile-card p {
            margin: 0;
            color: #7f8fa6;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- 
          주의: 아래 src="profile.jpg" 부분의 'profile.jpg'는 
          GitHub에 올리실 실제 이미지 파일명과 정확히 똑같아야 합니다.
        -->
        <img src="profile.jpg" alt="프로필 사진">
        
        <h1>박채원</h1>
        <p>안녕하세요! 방문해 주셔서 감사합니다. <br>이곳은 저의 프로필 페이지입니다.</p>
    </div>

</body>
</html>
